<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 26px;
    background: radial-gradient(1200px 640px at 50% -10%, #fcf8f0 0%, #f1e9da 62%, #e8dfcd 100%);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    position: relative;
    width: min(1120px, 100%);
    border-radius: 24px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 30px 70px -30px rgba(44, 56, 62, .55),
      0 2px 0 rgba(255, 255, 255, .9) inset,
      0 0 0 1px rgba(44, 56, 62, .07);
  }
  svg { display: block; width: 100%; height: auto; }

  .badge {
    position: absolute;
    top: 20px; left: 22px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 15px 8px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(46, 64, 72, .10);
    backdrop-filter: blur(6px);
    color: #3b4b53;
    font-size: 11.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    user-select: none;
  }
  .badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ef9a3e;
    box-shadow: 0 0 0 4px rgba(239, 154, 62, .18);
  }

  /* ---------- 场景滚动 ---------- */
  .cloud-a { animation: drift 60s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1500px); } }

  .hills-far  { animation: hillsFar 34s linear infinite; }
  @keyframes hillsFar  { from { transform: translateX(0); } to { transform: translateX(-560px); } }

  .hills-near { animation: hillsNear 17s linear infinite; }
  @keyframes hillsNear { from { transform: translateX(0); } to { transform: translateX(-680px); } }

  .dash { animation: dash .6s linear infinite; }
  @keyframes dash { from { transform: translateX(0); } to { transform: translateX(-90px); } }

  /* ---------- 速度线 ---------- */
  .speed { animation: streak 1.4s ease-in-out infinite; opacity: 0; }
  .s1 { animation-delay: -.2s; }
  .s2 { animation-delay: -.7s; }
  .s3 { animation-delay: -1.05s; }
  @keyframes streak {
    0%   { transform: translateX(46px); opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateX(-96px); opacity: 0; }
  }

  /* ---------- 车轮扬尘 ---------- */
  .dust {
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 1.6s ease-out infinite;
    opacity: 0;
  }
  .d1 { animation-delay: 0s; }
  .d2 { animation-delay: .55s; }
  .d3 { animation-delay: 1.05s; }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.35); opacity: 0; }
    20%  { opacity: .5; }
    100% { transform: translate(-58px, -13px) scale(1.7); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud-a, .hills-far, .hills-near, .dash, .speed, .dust { animation: none; }
    .speed { opacity: .35; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge"><span class="dot"></span>Pelican · 骑行中</div>

  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img"

        <stop offset="1" stop-color="#59636d"/>

      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">

        <stop offset="1" stop-color="#b2d1ba"/>

      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">

        <stop offset="1" stop-color="#8ab793"/>

      <linearGradient id="wingFill" x1="0.1" y1="0" x2="0.6" y2="1">

        <stop offset="1"   stop-color="#e7dcc8"/>

        <stop offset="1" stop-color="#e98a2b"/>

        <circle cx="8"   cy="-15" r="25" fill="#ffffff"/>
        <circle cx="32"  cy="-3" r="15" fill="#ffffff"/>
